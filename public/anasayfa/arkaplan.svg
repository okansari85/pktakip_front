<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620" preserveAspectRatio="xMaxYMin slice" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="yatayBoru" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fc"/><stop offset=".35" stop-color="#cfdbe8"/><stop offset=".75" stop-color="#a9bbce"/><stop offset="1" stop-color="#8fa4ba"/>
    </linearGradient>
    <linearGradient id="dikeyBoru" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef4fa"/><stop offset=".4" stop-color="#cbd8e6"/><stop offset=".8" stop-color="#a8bacd"/><stop offset="1" stop-color="#93a8be"/>
    </linearGradient>
    <linearGradient id="kirmizi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9605c"/><stop offset=".4" stop-color="#e88a84"/><stop offset="1" stop-color="#b8403f"/>
    </linearGradient>
    <linearGradient id="dolapZemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fc"/><stop offset="1" stop-color="#dfe7ef"/>
    </linearGradient>
    <linearGradient id="yesil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd0a8"/><stop offset="1" stop-color="#2fa883"/>
    </linearGradient>
    <linearGradient id="soldanSolma" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".12" stop-color="#000"/><stop offset=".52" stop-color="#777"/><stop offset=".72" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="alttanSolma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#fff"/><stop offset=".94" stop-color="#000"/>
    </linearGradient>
    <mask id="solma1"><rect width="1300" height="620" fill="url(#soldanSolma)"/></mask>
    <mask id="solma2"><rect width="1300" height="620" fill="url(#alttanSolma)"/></mask>
    <filter id="pus"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="yumusak"><feGaussianBlur stdDeviation=".5"/></filter>
  </defs>

  <g mask="url(#solma2)" opacity=".62"><g mask="url(#solma1)">
    <!-- Uzak depo: raflar, kolonlar, sisli derinlik -->
    <g filter="url(#pus)" opacity=".42" fill="#b6c7d8">
      <rect x="470" y="150" width="26" height="430"/>
      <rect x="640" y="130" width="20" height="450"/>
      <rect x="1040" y="110" width="30" height="470"/>
      <rect x="760" y="380" width="46" height="150"/><rect x="816" y="410" width="34" height="120"/>
      <rect x="860" y="360" width="54" height="170"/><rect x="924" y="400" width="40" height="130"/>
      <rect x="520" y="420" width="44" height="110"/><rect x="574" y="440" width="36" height="90"/>
      <rect x="700" y="430" width="38" height="100"/>
      <rect x="430" y="520" width="680" height="10"/>
    </g>

    <!-- Tavan: ikincil borular -->
    <g opacity=".72">
      <rect x="330" y="118" width="660" height="13" fill="url(#yatayBoru)" transform="rotate(-8 330 118)"/>
      <rect x="760" y="-30" width="15" height="230" fill="url(#dikeyBoru)" transform="rotate(30 760 -30)"/>
      <rect x="520" y="-20" width="14" height="160" fill="url(#dikeyBoru)" transform="rotate(-24 520 -20)"/>
      <rect x="1020" y="30" width="280" height="14" fill="url(#yatayBoru)"/>
    </g>

    <!-- Ana boru: dirsek ve flanşlar -->
    <g>
      <rect x="360" y="86" width="330" height="30" rx="3" fill="url(#yatayBoru)" transform="rotate(-5 360 86)"/>
      <rect x="444" y="72" width="11" height="42" rx="2" fill="#a7b9cc" transform="rotate(-5 450 92)"/>
      <rect x="610" y="58" width="11" height="42" rx="2" fill="#a7b9cc" transform="rotate(-5 615 80)"/>
      <path d="M680 58 h24 a44 44 0 0 0 44 -44 v-30 h32 v32 a74 74 0 0 1 -74 74 h-26 z" fill="url(#yatayBoru)"/>
      <rect x="742" y="-10" width="44" height="13" rx="2" fill="#a7b9cc"/>
      <!-- Sprinkler inişi -->
      <rect x="674" y="74" width="28" height="44" fill="url(#dikeyBoru)"/>
      <rect x="668" y="112" width="40" height="10" rx="2" fill="#9eb1c5"/>
    </g>

    <!-- Sprinkler başlığı -->
    <g>
      <rect x="678" y="122" width="20" height="10" fill="#b9c8d7"/>
      <path d="M672 132 h32 l-5 22 h-22 z" fill="url(#kirmizi)"/>
      <path d="M680 154 l-4 22 M696 154 l4 22" stroke="#8ea2b6" stroke-width="3" fill="none"/>
      <ellipse cx="688" cy="166" rx="4.5" ry="10" fill="#e4635c"/>
      <ellipse cx="686.6" cy="163" rx="1.3" ry="4.5" fill="#ffd6d3"/>
      <path d="M664 182 q24 -12 48 0 l-5 4 q-19 -8 -38 0 z" fill="#93a7bb"/>
      <g stroke="#a9bccf" stroke-width="1.5" stroke-linecap="round" opacity=".75">
        <path d="M668 190 l-13 19"/><path d="M676 192 l-7 23"/><path d="M684 193 l-3 25"/><path d="M692 193 l3 25"/><path d="M700 192 l7 23"/><path d="M708 190 l13 19"/>
      </g>
    </g>

    <!-- Dikey hatlar -->
    <g opacity=".85">
      <rect x="1012" y="20" width="24" height="560" fill="url(#dikeyBoru)"/>
      <rect x="1006" y="118" width="36" height="10" rx="2" fill="#a7b9cc"/>
      <rect x="1006" y="330" width="36" height="10" rx="2" fill="#a7b9cc"/>
      <rect x="1064" y="44" width="15" height="110" fill="url(#dikeyBoru)"/>
      <rect x="1262" y="44" width="16" height="110" fill="url(#dikeyBoru)"/>
    </g>

    <!-- Acil çıkış levhası (yazısız) -->
    <g transform="translate(868 172) rotate(-3)">
      <rect x="20" y="-34" width="4" height="34" fill="#a7b9cc"/>
      <rect x="76" y="-34" width="4" height="34" fill="#a7b9cc"/>
      <rect x="-3" y="-3" width="110" height="60" rx="5" fill="#dfe8f0"/>
      <rect width="104" height="54" rx="4" fill="url(#yesil)"/>
      <rect x="6" y="6" width="42" height="42" rx="2" fill="#f4fbf8"/>
      <g fill="none" stroke="#2fa883" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M28 21 l-4 12"/><path d="M27 23 l8 5 M27 23 l-9 3"/><path d="M24 33 l7 5 l-2 7"/><path d="M24 33 l-5 6 l-6 0"/>
      </g>
      <circle cx="30" cy="14" r="3.6" fill="#2fa883"/>
      <path d="M60 27 h28 M78 16 l11 11 l-11 11" fill="none" stroke="#f4fbf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Yangın dolabı ve hortum makarası -->
    <g transform="translate(1110 150)">
      <rect x="-8" y="-6" width="200" height="330" rx="6" fill="#c9625f"/>
      <rect x="0" y="2" width="184" height="314" rx="3" fill="#d9817b"/>
      <rect x="10" y="12" width="164" height="294" rx="2" fill="url(#dolapZemin)"/>
      <path d="M10 12 h164 v54 l-164 88 z" fill="#ffffff" opacity=".45"/>
      <g fill="none">
        <circle cx="92" cy="146" r="74" stroke="#c6d3e0" stroke-width="7"/>
        <circle cx="92" cy="146" r="64" stroke="#e7a39d" stroke-width="7"/>
        <circle cx="92" cy="146" r="55" stroke="#edb8b3" stroke-width="7"/>
        <circle cx="92" cy="146" r="46" stroke="#e7a39d" stroke-width="7"/>
        <circle cx="92" cy="146" r="37" stroke="#edb8b3" stroke-width="7"/>
        <circle cx="92" cy="146" r="28" stroke="#e7a39d" stroke-width="7"/>
      </g>
      <circle cx="92" cy="146" r="20" fill="#c4d1de"/>
      <circle cx="92" cy="146" r="8" fill="#92a6ba"/>
      <rect x="86" y="222" width="12" height="60" rx="3" fill="#c76b66"/>
      <rect x="82" y="278" width="20" height="16" rx="3" fill="#a9bbce"/>
    </g>

    <!-- Yangın söndürücü -->
    <g transform="translate(1040 276)">
      <path d="M31 18 C10 18 3 40 4 62 C5 94 4 130 8 168" fill="none" stroke="#6f8195" stroke-width="5" stroke-linecap="round"/>
      <rect x="28" y="4" width="20" height="18" rx="2" fill="#94a7ba"/>
      <path d="M26 6 l32 -8 l3 7 l-34 7 z" fill="#7e91a5"/>
      <path d="M38 22 C18 24 14 42 14 58 V192 a8 8 0 0 0 8 8 H54 a8 8 0 0 0 8 -8 V58 C62 42 58 24 38 22 z" fill="url(#kirmizi)"/>
      <rect x="22" y="84" width="32" height="66" rx="2" fill="#f7efee"/>
      <rect x="27" y="94" width="22" height="4" fill="#d9a7a3"/><rect x="27" y="104" width="22" height="4" fill="#d9a7a3"/><rect x="27" y="114" width="16" height="4" fill="#d9a7a3"/>
      <rect x="14" y="190" width="48" height="10" rx="3" fill="#76889b"/>
    </g>
  </g></g>
</svg>
