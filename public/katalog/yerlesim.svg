  <rect x="488" y="318" width="34" height="44" rx="3" fill="url(#kirmizi)"/><rect x="494" y="325" width="22" height="28" rx="2" fill="#ffffff" opacity=".85"/><circle cx="505" cy="339" r="7" fill="none" stroke="#c62828" stroke-width="2"/>
  <rect x="380" y="420" width="140" height="6" fill="#c3cbd3"/><rect x="380" y="426" width="140" height="12" fill="#9aa4af"/>
  <circle cx="412" cy="398" r="22" fill="url(#kirmizi)"/><circle cx="412" cy="398" r="8" fill="#9b1c1c"/>
  <rect x="432" y="390" width="14" height="18" fill="#6b7280"/>
  <rect x="446" y="378" width="64" height="40" rx="8" fill="url(#kirmizi)"/>
  <g stroke="#a12a22" stroke-width="2"><line x1="458" y1="381" x2="458" y2="415"/><line x1="468" y1="381" x2="468" y2="415"/><line x1="478" y1="381" x2="478" y2="415"/><line x1="488" y1="381" x2="488" y2="415"/><line x1="498" y1="381" x2="498" y2="415"/></g>
