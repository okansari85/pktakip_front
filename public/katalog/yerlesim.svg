  <path d="M548 225 C557 233 555 244 548 246 C541 244 539 235 545 230 C545 234 547 236 548 236 C549 232 547 229 548 225 Z" fill="#ffffff"/>
  <rect x="572" y="226" width="100" height="6" rx="3" fill="#ffffff" opacity=".9"/>
  <rect x="572" y="240" width="74" height="6" rx="3" fill="#ffffff" opacity=".7"/>

