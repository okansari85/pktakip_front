  <rect x="300" y="150" width="70" height="30" fill="#dfe4ea" stroke="#c3ccd6"/>
  <polygon points="300,150 312,143 382,143 370,150" fill="#eef1f4" stroke="#c3ccd6"/>
  <polygon points="370,150 382,143 382,172 370,180" fill="#c9d1da"/>
