  <rect x="395" y="328" width="16" height="5" fill="#9b1c1c"/><rect x="395" y="362" width="16" height="5" fill="#9b1c1c"/>
  <circle cx="403" cy="347" r="11" fill="none" stroke="#c62828" stroke-width="3"/>
  <line x1="392" y1="347" x2="414" y2="347" stroke="#c62828" stroke-width="2"/><line x1="403" y1="336" x2="403" y2="358" stroke="#c62828" stroke-width="2"/>
  <line x1="440" y1="310" x2="440" y2="326" stroke="#6b7280" stroke-width="3"/>
