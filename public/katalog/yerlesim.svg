    <rect x="350" y="402" width="9" height="38" fill="#f5b800"/><rect x="350" y="410" width="9" height="6" fill="#1f2937"/><rect x="350" y="424" width="9" height="6" fill="#1f2937"/>
    <rect x="541" y="402" width="9" height="38" fill="#f5b800"/><rect x="541" y="410" width="9" height="6" fill="#1f2937"/><rect x="541" y="424" width="9" height="6" fill="#1f2937"/>
  </g>

  <!-- Jeneratör -->
  <rect x="712" y="456" width="98" height="6" fill="#4b5563"/>
  <polygon points="716,412 730,402 820,402 806,412" fill="#ffd84d"/>
  <polygon points="806,412 820,402 820,448 806,458" fill="#c99500"/>
  <rect x="716" y="412" width="90" height="46" rx="3" fill="url(#sari)"/>
  <g fill="#7a5b00"><rect x="726" y="422" width="34" height="4" rx="2"/><rect x="726" y="430" width="34" height="4" rx="2"/><rect x="726" y="438" width="34" height="4" rx="2"/><rect x="726" y="446" width="34" height="4" rx="2"/></g>
  <rect x="770" y="422" width="26" height="18" rx="2" fill="#2b3038"/><rect x="774" y="426" width="10" height="4" rx="1" fill="#4ade80"/>
  <rect x="790" y="390" width="6" height="14" fill="#6b7280"/>

  <!-- Zemindeki sarı çizgi ve öndeki çalılar -->
