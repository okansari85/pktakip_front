  <g stroke="#e9eef3" stroke-width="2">
    <line x1="226" y1="218" x2="226" y2="254"/><line x1="256" y1="218" x2="256" y2="254"/><line x1="286" y1="218" x2="286" y2="254"/><line x1="316" y1="218" x2="316" y2="254"/><line x1="346" y1="218" x2="346" y2="254"/><line x1="376" y1="218" x2="376" y2="254"/><line x1="406" y1="218" x2="406" y2="254"/><line x1="436" y1="218" x2="436" y2="254"/><line x1="466" y1="218" x2="466" y2="254"/>
