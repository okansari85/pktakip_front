<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 104 870 452" role="presentation" aria-hidden="true">
  <!-- Örnek yerleşim (tasarım kataloğu): yuvarlak zemin üstünde bina; bölmelerde forklift, yangın pompası, itfaiye aracı, dışarıda jeneratör. Elle çizildi. -->
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8f9fb"/><stop offset="1" stop-color="#dde3e9"/></linearGradient>
    <linearGradient id="kenar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b6bfca"/><stop offset=".5" stop-color="#dfe4ea"/><stop offset="1" stop-color="#a9b3be"/></linearGradient>
    <linearGradient id="cephe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eff2f5"/><stop offset="1" stop-color="#d7dde4"/></linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d1da"/><stop offset="1" stop-color="#f2f4f7"/></linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f86a0"/><stop offset=".55" stop-color="#aabdd0"/><stop offset="1" stop-color="#5a718c"/></linearGradient>
    <linearGradient id="kirmizi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5483d"/><stop offset="1" stop-color="#b3261e"/></linearGradient>
    <linearGradient id="sari" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#e0a800"/></linearGradient>
    <radialGradient id="golge" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1f2937" stop-opacity=".22"/><stop offset="1" stop-color="#1f2937" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- Zemin -->
  <ellipse cx="450" cy="494" rx="440" ry="66" fill="url(#golge)"/>
  <path d="M40 430 A410 85 0 0 0 860 430 L860 452 A410 85 0 0 1 40 452 Z" fill="url(#kenar)"/>
  <ellipse cx="450" cy="430" rx="410" ry="85" fill="url(#zemin)" stroke="#ffffff" stroke-opacity=".8" stroke-width="2"/>

  <!-- Arkadaki ağaçlar -->
  <rect x="117" y="392" width="6" height="42" fill="#8b6b4a"/>
  <circle cx="120" cy="378" r="26" fill="#5fae5a"/><circle cx="103" cy="392" r="18" fill="#4f9d4b"/><circle cx="137" cy="392" r="18" fill="#6bbb63"/><circle cx="120" cy="356" r="17" fill="#74c46b"/>
  <rect x="832" y="372" width="6" height="40" fill="#8b6b4a"/>
  <circle cx="835" cy="360" r="22" fill="#5fae5a"/><circle cx="821" cy="372" r="15" fill="#4f9d4b"/><circle cx="849" cy="371" r="15" fill="#6bbb63"/>

