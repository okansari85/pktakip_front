  <ellipse cx="162" cy="452" rx="26" ry="12" fill="#5fae5a"/><ellipse cx="146" cy="456" rx="14" ry="8" fill="#4f9d4b"/>
  <ellipse cx="846" cy="420" rx="18" ry="9" fill="#5fae5a"/>
