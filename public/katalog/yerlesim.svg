  <g fill="#ffffff"><rect x="222" y="286" width="40" height="4" rx="2"/><rect x="282" y="286" width="40" height="4" rx="2"/><rect x="396" y="286" width="44" height="4" rx="2"/><rect x="462" y="286" width="44" height="4" rx="2"/><rect x="590" y="286" width="72" height="4" rx="2"/></g>
