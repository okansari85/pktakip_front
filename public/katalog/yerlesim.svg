  <rect x="558" y="336" width="8" height="16" rx="2" fill="#374151"/><rect x="686" y="336" width="8" height="16" rx="2" fill="#374151"/>
  <rect x="568" y="318" width="116" height="104" rx="8" fill="url(#kirmizi)"/>
  <rect x="578" y="330" width="96" height="34" rx="4" fill="url(#cam)"/>
  <line x1="626" y1="330" x2="626" y2="364" stroke="#c7d2de" stroke-width="2"/>
  <rect x="568" y="368" width="116" height="4" fill="#ffffff" opacity=".8"/>
  <rect x="598" y="376" width="56" height="26" rx="3" fill="#8f1d17"/>
  <g stroke="#f3f4f6" stroke-width="2"><line x1="602" y1="382" x2="650" y2="382"/><line x1="602" y1="389" x2="650" y2="389"/><line x1="602" y1="396" x2="650" y2="396"/></g>
  <circle cx="584" cy="386" r="7" fill="#fff7d6" stroke="#9ca3af"/><circle cx="668" cy="386" r="7" fill="#fff7d6" stroke="#9ca3af"/>
